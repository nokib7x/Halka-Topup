<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halka Topup</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
}

header{
    background:#00ff99;
    color:#000;
    text-align:center;
    padding:15px;
    font-size:20px;
    font-weight:bold;
}

.logo{
    text-align:center;
    margin-top:10px;
}

.logo img{
    width:90px;
    border-radius:10px;
}

.container{
    padding:15px;
}

.card{
    background:#1c2a40;
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
}

.item{
    background:#0f1b2d;
    padding:10px;
    margin:8px 0;
    border-radius:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

button{
    padding:8px 12px;
    background:#00ff99;
    border:none;
    border-radius:6px;
    font-weight:bold;
    cursor:pointer;
}

input{
    width:100%;
    padding:10px;
    margin-top:8px;
    border-radius:8px;
    border:none;
}

select{
    width:100%;
    padding:10px;
    margin-top:8px;
    border-radius:8px;
}

</style>
</head>

<body>

<header>🔥 HALKA TOPUP - FREE FIRE DIAMONDS</header>

<div class="logo">
    <img src="https://i.imgur.com/3ZQ3ZQb.png" alt="logo">
</div>

<div class="container">

<!-- DIAMOND LIST -->
<div class="card">
<h3>💎 Diamond List</h3>

<div class="item">25 Diamonds <b>24 TK</b> <button onclick="selectPack('25 Diamonds - 24 TK')">Buy</button></div>
<div class="item">50 Diamonds <b>38 TK</b> <button onclick="selectPack('50 Diamonds - 38 TK')">Buy</button></div>
<div class="item">115 Diamonds <b>78 TK</b> <button onclick="selectPack('115 Diamonds - 78 TK')">Buy</button></div>
<div class="item">240 Diamonds <b>155 TK</b> <button onclick="selectPack('240 Diamonds - 155 TK')">Buy</button></div>
<div class="item">610 Diamonds <b>385 TK</b> <button onclick="selectPack('610 Diamonds - 385 TK')">Buy</button></div>
<div class="item">1240 Diamonds <b>755 TK</b> <button onclick="selectPack('1240 Diamonds - 755 TK')">Buy</button></div>
<div class="item">2530 Diamonds <b>1500 TK</b> <button onclick="selectPack('2530 Diamonds - 1500 TK')">Buy</button></div>
<div class="item">Weekly <b>150 TK</b> <button onclick="selectPack('Weekly - 150 TK')">Buy</button></div>
<div class="item">Monthly <b>755 TK</b> <button onclick="selectPack('Monthly - 755 TK')">Buy</button></div>

</div>

<!-- ORDER FORM -->
<div class="card">
<h3>🛒 Order Details</h3>

<input type="text" id="pack" placeholder="Selected Package" readonly>
<input type="text" id="uid" placeholder="Enter Free Fire UID">

<select id="method">
<option>bKash</option>
<option>Nagad</option>
</select>

<input type="text" id="trx" placeholder="Transaction ID">

<button onclick="order()">🚀 PLACE ORDER</button>

</div>

<!-- PAYMENT -->
<div class="card">
<h3>💳 Payment Number</h3>
<p>bKash / Nagad: <b>01400687053</b></p>
</div>

</div>

<script>
function selectPack(p){
    document.getElementById("pack").value = p;
}

function order(){
    let pack = document.getElementById("pack").value;
    let uid = document.getElementById("uid").value;
    let method = document.getElementById("method").value;
    let trx = document.getElementById("trx").value;

    if(pack=="" || uid=="" || trx==""){
        alert("সব তথ্য পূরণ করো");
        return;
    }

    let msg =
`🔥 New Order%0A
Package: ${pack}%0A
UID: ${uid}%0A
Payment Method: ${method}%0A
Transaction ID: ${trx}`;

    let url = "https://wa.me/8801400687053?text=" + msg;

    window.open(url, "_blank");
}
</script>

</body>
</html>
